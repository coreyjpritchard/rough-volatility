name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (fast)
        run: pytest -m "not slow" -n auto

      # --nbmake-kernel overrides the notebook's own kernelspec, which is pinned to
      # the local conda kernel ("projects-env") so that a clean-kernel run on a
      # developer machine cannot silently pick up the wrong interpreter. The runner
      # has a single Python, registered as "python3".
      - name: Notebook (synthetic data only, no IB)
        run: pytest --nbmake --nbmake-kernel=python3 -n auto 00_warmup.ipynb
