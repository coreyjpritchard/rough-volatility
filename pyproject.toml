[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rough-volatility"
version = "0.1.0"
description = "Estimating and simulating rough volatility: fBm, the hybrid scheme, rough Bergomi."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",          # parquet cache for IB history
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "jupyterlab>=4.1",
    "python-dotenv>=1.0",
    "ib_async>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["roughvol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long Monte Carlo runs; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
